<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScooterFleet</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <header></header>
    <main>
        <nav class="navbar navbar-expand rounded-3 px-3 mb-4" style="background-color: #172554;" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="#">
                    ScooterFleet
                </a>
                <span class="navbar-text ms-auto d-none d-sm-inline">
                    Elektromos roller flottakezelő
                </span>
            </div>
        </nav>

        <section class="container py-3">
            <div class="row g-3 mb-4">
                <div class="col-lg-4 col-md-5">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">Rollerek száma</h5>
                            <p>0</p>
                            <div class="row g-2">
                                <div class="col-6">
                                    <div>
                                        <h6>Elérhető</h6>
                                        <p>0</p>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div>
                                        <h6>Töltés alatt</h6>
                                        <p>0</p>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div>
                                        <h6>Alacsony töltöttség</h6>
                                        <p>0</p>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div>
                                        <h6>Karbantartás alatt</h6>
                                        <p>0</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8 col-md-7">


                </div>
            </div>

            <div class="card mb-4">
                <div class="card-body p-3">
                    <form>
                        <div class="row g-2 align-items-end">
                            <div class="col-lg-4 col-md-4">
                                <label class="form-label">Modell</label>
                                <input type="text" class="form-control" placeholder="Roller modellje" required>
                            </div>
                            <div class="col-lg-2 col-md-2">
                                <label class="form-label">Töltöttség (%)</label>
                                <input type="number" class="form-control" placeholder="0–100" min="0"
                                    max="100" step="1" required>
                            </div>
                            <div class="col-lg-3 col-md-3">
                                <label class="form-label">Körzet</label>
                                <input type="text" class="form-control" placeholder="Körzet neve" required>
                            </div>
                            <div class="col-lg-3 col-md-3">
                                <button type="button" class="btn gomb w-100">Hozzáadás</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="d-flex mb-3">
                <button type="button" class="btn btn-danger">20% alatti töltöttség</button>
            </div>
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Modell</th>
                            <th>Töltöttség</th>
                            <th>Állapot</th>
                            <th>Körzet neve</th>
                            <th>Megtett kilométer</th>
                            <th>Műveletek</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                        
                    </tbody>
                </table>
            </div>

            <div class="modal fade" id="TorlesModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered modal-sm">
                    <div class="modal-content">
                        <div class="modal-body">
                            <p class="mb-0">Biztosan törlöd a <b id="Torles"></b> rollert?</p>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Mégse</button>
                            <button class="btn btn-danger" id="TorlesMegerosites">Törlés</button>
                        </div>
                    </div>
                </div>
        </section>
    </main>

    <footer></footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/RollerKezeles.js"></script>
    <script src="js/Rollerek.js"></script>
    <script src="js/RollerTeszt.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
